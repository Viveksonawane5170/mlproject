<!DOCTYPE html>
<html>

<head>

    <title>Student Performance Prediction</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 600px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        select:focus,
        input:focus {
            border-color: #2563eb;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            text-align: center;
            background-color: #eef6ff;
            border-radius: 7px;
        }

        .result h2 {
            margin: 5px;
        }

        .score {
            font-size: 28px;
            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>Student Performance Prediction</h1>

    <p class="subtitle">
        Predict the student's Mathematics score
    </p>


    <form action="{{ url_for('predict_datapoint') }}" method="post">


        <!-- Gender -->

        <div class="field">

            <label>Gender</label>

            <select name="gender" required>

                <option value="" disabled selected>
                    Select Gender
                </option>

                <option value="male">
                    Male
                </option>

                <option value="female">
                    Female
                </option>

            </select>

        </div>


        <!-- Race / Ethnicity -->

        <div class="field">

            <label>Race or Ethnicity</label>

            <select name="ethnicity" required>

                <option value="" disabled selected>
                    Select Ethnicity
                </option>

                <option value="group A">
                    Group A
                </option>

                <option value="group B">
                    Group B
                </option>

                <option value="group C">
                    Group C
                </option>

                <option value="group D">
                    Group D
                </option>

                <option value="group E">
                    Group E
                </option>

            </select>

        </div>


        <!-- Parent Education -->

        <div class="field">

            <label>Parental Level of Education</label>

            <select
                name="parental_level_of_education"
                required>

                <option value="" disabled selected>
                    Select Parent Education
                </option>

                <option value="associate's degree">
                    Associate's Degree
                </option>

                <option value="bachelor's degree">
                    Bachelor's Degree
                </option>

                <option value="high school">
                    High School
                </option>

                <option value="master's degree">
                    Master's Degree
                </option>

                <option value="some college">
                    Some College
                </option>

                <option value="some high school">
                    Some High School
                </option>

            </select>

        </div>


        <!-- Lunch -->

        <div class="field">

            <label>Lunch Type</label>

            <select name="lunch" required>

                <option value="" disabled selected>
                    Select Lunch Type
                </option>

                <option value="free/reduced">
                    Free / Reduced
                </option>

                <option value="standard">
                    Standard
                </option>

            </select>

        </div>


        <!-- Test Preparation -->

        <div class="field">

            <label>Test Preparation Course</label>

            <select
                name="test_preparation_course"
                required>

                <option value="" disabled selected>
                    Select Test Preparation
                </option>

                <option value="none">
                    None
                </option>

                <option value="completed">
                    Completed
                </option>

            </select>

        </div>


        <!-- Reading Score -->

        <div class="field">

            <label>Reading Score (0-100)</label>

            <input
                type="number"
                name="reading_score"
                placeholder="Enter reading score"
                min="0"
                max="100"
                required>

        </div>


        <!-- Writing Score -->

        <div class="field">

            <label>Writing Score (0-100)</label>

            <input
                type="number"
                name="writing_score"
                placeholder="Enter writing score"
                min="0"
                max="100"
                required>

        </div>


        <!-- Submit Button -->

        <button type="submit">
            Predict Mathematics Score
        </button>


    </form>


    <!-- Prediction Result -->

    {% if results is defined %}

    <div class="result">

        <h2>Predicted Mathematics Score</h2>

        <div class="score">
            {{ "%.2f"|format(results) }}
        </div>

        <p>Score out of 100</p>

    </div>

    {% endif %}


</div>

</body>

</html>
